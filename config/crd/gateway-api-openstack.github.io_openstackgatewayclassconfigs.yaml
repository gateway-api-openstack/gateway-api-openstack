apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: openstackgatewayclassconfigs.gateway-api-openstack.github.io
spec:
  group: gateway-api-openstack.github.io
  names:
    kind: OpenStackGatewayClassConfig
    listKind: OpenStackGatewayClassConfigList
    plural: openstackgatewayclassconfigs
    singular: openstackgatewayclassconfig
  scope: Cluster
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          required:
            - spec
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required:
                - vipSubnet
                - memberSubnet
              properties:
                frontendSecurity:
                  type: object
                  default:
                    mode: OctaviaManaged
                  x-kubernetes-validations:
                    - rule: "self.mode == 'Referenced' ? has(self.groups) : !has(self.groups)"
                      message: Referenced requires groups and OctaviaManaged forbids them.
                  properties:
                    mode:
                      type: string
                      default: OctaviaManaged
                      enum:
                        - OctaviaManaged
                        - Referenced
                    groups:
                      type: array
                      minItems: 1
                      maxItems: 16
                      x-kubernetes-list-type: atomic
                      items:
                        type: object
                        x-kubernetes-validations:
                          - rule: "(has(self.id) ? 1 : 0) + (has(self.name) ? 1 : 0) + (has(self.tags) ? 1 : 0) == 1"
                            message: Select exactly one of id, name, or tags.
                        properties:
                          id:
                            type: string
                            pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'
                          name:
                            type: string
                            minLength: 1
                            maxLength: 255
                            pattern: '^[^\p{Z}\p{Cc}]([^\p{Cc}]*[^\p{Z}\p{Cc}])?$'
                          tags:
                            type: array
                            minItems: 1
                            maxItems: 16
                            x-kubernetes-list-type: set
                            items:
                              type: string
                              minLength: 1
                              maxLength: 60
                              pattern: '^[^,\p{Z}\p{Cc}]([^,\p{Cc}]*[^,\p{Z}\p{Cc}])?$'
                backendSecurity:
                  type: object
                  default:
                    mode: Unmanaged
                  x-kubernetes-validations:
                    - rule: "self.mode == 'Referenced' ? has(self.groups) : !has(self.groups)"
                      message: Referenced requires groups and Unmanaged forbids them.
                  properties:
                    mode:
                      type: string
                      default: Unmanaged
                      enum:
                        - Unmanaged
                        - Referenced
                    groups:
                      type: array
                      minItems: 1
                      maxItems: 16
                      x-kubernetes-list-type: atomic
                      items:
                        type: object
                        x-kubernetes-validations:
                          - rule: "(has(self.id) ? 1 : 0) + (has(self.name) ? 1 : 0) + (has(self.tags) ? 1 : 0) == 1"
                            message: Select exactly one of id, name, or tags.
                        properties:
                          id:
                            type: string
                            pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'
                          name:
                            type: string
                            minLength: 1
                            maxLength: 255
                            pattern: '^[^\p{Z}\p{Cc}]([^\p{Cc}]*[^\p{Z}\p{Cc}])?$'
                          tags:
                            type: array
                            minItems: 1
                            maxItems: 16
                            x-kubernetes-list-type: set
                            items:
                              type: string
                              minLength: 1
                              maxLength: 60
                              pattern: '^[^,\p{Z}\p{Cc}]([^,\p{Cc}]*[^,\p{Z}\p{Cc}])?$'
                vipSubnet:
                  type: object
                  x-kubernetes-validations:
                    - rule: "(has(self.id) ? 1 : 0) + (has(self.name) ? 1 : 0) + (has(self.tags) ? 1 : 0) == 1"
                      message: Select exactly one of id, name, or tags.
                  properties:
                    id:
                      type: string
                      pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'
                    name:
                      type: string
                      minLength: 1
                      maxLength: 255
                      pattern: '^[^\p{Z}\p{Cc}]([^\p{Cc}]*[^\p{Z}\p{Cc}])?$'
                    tags:
                      type: array
                      minItems: 1
                      maxItems: 16
                      x-kubernetes-list-type: set
                      items:
                        type: string
                        minLength: 1
                        maxLength: 60
                        pattern: '^[^,\p{Z}\p{Cc}]([^,\p{Cc}]*[^,\p{Z}\p{Cc}])?$'
                memberSubnet:
                  type: object
                  x-kubernetes-validations:
                    - rule: "(has(self.id) ? 1 : 0) + (has(self.name) ? 1 : 0) + (has(self.tags) ? 1 : 0) == 1"
                      message: Select exactly one of id, name, or tags.
                  properties:
                    id:
                      type: string
                      pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'
                    name:
                      type: string
                      minLength: 1
                      maxLength: 255
                      pattern: '^[^\p{Z}\p{Cc}]([^\p{Cc}]*[^\p{Z}\p{Cc}])?$'
                    tags:
                      type: array
                      minItems: 1
                      maxItems: 16
                      x-kubernetes-list-type: set
                      items:
                        type: string
                        minLength: 1
                        maxLength: 60
                        pattern: '^[^,\p{Z}\p{Cc}]([^,\p{Cc}]*[^,\p{Z}\p{Cc}])?$'
                floatingIP:
                  type: object
                  default:
                    mode: None
                  x-kubernetes-validations:
                    - rule: "self.mode == 'Allocate' ? has(self.externalNetwork) : !has(self.externalNetwork)"
                      message: Allocate requires externalNetwork and None forbids it.
                  properties:
                    mode:
                      type: string
                      default: None
                      enum:
                        - None
                        - Allocate
                    externalNetwork:
                      type: object
                      x-kubernetes-validations:
                        - rule: "(has(self.id) ? 1 : 0) + (has(self.name) ? 1 : 0) + (has(self.tags) ? 1 : 0) == 1"
                          message: Select exactly one of id, name, or tags.
                      properties:
                        id:
                          type: string
                          pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'
                        name:
                          type: string
                          minLength: 1
                          maxLength: 255
                          pattern: '^[^\p{Z}\p{Cc}]([^\p{Cc}]*[^\p{Z}\p{Cc}])?$'
                        tags:
                          type: array
                          minItems: 1
                          maxItems: 16
                          x-kubernetes-list-type: set
                          items:
                            type: string
                            minLength: 1
                            maxLength: 60
                            pattern: '^[^,\p{Z}\p{Cc}]([^,\p{Cc}]*[^,\p{Z}\p{Cc}])?$'
                nodeAddressType:
                  type: string
                  default: InternalIP
                  enum:
                    - InternalIP
                    - ExternalIP
                flavorID:
                  type: string
                  pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'
                availabilityZone:
                  type: string
                  minLength: 1
                  maxLength: 255
                  pattern: '^[^\p{Z}\p{Cc}]([^\p{Cc}]*[^\p{Z}\p{Cc}])?$'
                healthMonitor:
                  type: object
                  default:
                    path: /
                    delay: 10
                    timeout: 5
                    maxRetries: 3
                    maxRetriesDown: 3
                  x-kubernetes-validations:
                    - rule: self.timeout < self.delay
                      message: timeout must be less than delay.
                  properties:
                    path:
                      type: string
                      default: /
                      maxLength: 255
                      pattern: '^/[^\p{Cc}]*$'
                    delay:
                      type: integer
                      format: int32
                      default: 10
                      minimum: 1
                      maximum: 3600
                    timeout:
                      type: integer
                      format: int32
                      default: 5
                      minimum: 1
                      maximum: 3600
                    maxRetries:
                      type: integer
                      format: int32
                      default: 3
                      minimum: 1
                      maximum: 10
                    maxRetriesDown:
                      type: integer
                      format: int32
                      default: 3
                      minimum: 1
                      maximum: 10
