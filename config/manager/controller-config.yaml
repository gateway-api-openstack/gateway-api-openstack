apiVersion: v1
kind: ConfigMap
metadata:
  name: openstack-gateway-controller-config
  labels:
    app.kubernetes.io/name: openstack-gateway-controller
    app.kubernetes.io/part-of: gateway-api-openstack
data:
  # Each GatewayClass must select this exact controller identity.
  GATEWAY_OPENSTACK_CONTROLLER_NAME: gateway-api-openstack.github.io/gateway-api-openstack
  # This value must remain stable for the lifetime of managed OpenStack resources.
  GATEWAY_OPENSTACK_CLUSTER_ID: replace-with-stable-cluster-id
  # Base interval for observing converged OpenStack resources again.
  GATEWAY_OPENSTACK_RESYNC_INTERVAL: 10m
  # One shared request budget covers Keystone, Octavia, and Neutron.
  GATEWAY_OPENSTACK_API_QPS: "10"
  GATEWAY_OPENSTACK_API_BURST: "20"
  # The mounted clouds.yaml must contain an entry with this name.
  OS_CLOUD: openstack
  OS_CLIENT_CONFIG_FILE: /etc/openstack/clouds.yaml
  # Leave empty to use region_name from clouds.yaml.
  OS_REGION_NAME: ""
