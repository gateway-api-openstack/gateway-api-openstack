# Replace each <digest> with the image's 64-character SHA-256 digest.
# Replace <git-commit> with the full 40-character controller source revision.
formatVersion: v1alpha1
kubernetes:
  dedicatedForE2E: true
  kubeconfig: /absolute/path/to/e2e.kubeconfig
  context: openstack-e2e
  # Supply both identity fields for lifecycle, member, or Floating IP scenarios.
  # expectedAPIServer: https://api.example.test:6443
  # expectedClusterUID: 33333333-3333-4333-8333-333333333333
openstack:
  projectMode: dedicated
  dedicatedForE2E: true
  # For a shared project, set projectMode to shared, remove dedicatedForE2E,
  # and add acceptProjectWideCredentialRisk: true.
  # Shared Cluster and Floating IP faults also require allowSharedNetworkTests: true
  # and backend.expectedWorkers, as described in docs/testing-openstack-e2e.md.
  expectedProjectID: "00000000000000000000000000000000"
  cloud: openstack-e2e
  region: RegionOne
  controllerCloudsYAML: /absolute/path/to/controller-clouds.yaml
  # Omit auditCloudsYAML to reuse controllerCloudsYAML for the audit.
  # auditCloudsYAML: /absolute/path/to/audit-clouds.yaml
  vipSubnetID: 11111111-1111-1111-1111-111111111111
  memberSubnetID: 22222222-2222-2222-2222-222222222222
  externalNetworkID: none
  # Referenced frontend groups require 2.29 or later. The default is 2.5.
  # microversion: "2.29"
  # Referenced groups and worker port associations must already exist.
  # The suite only reads these groups and ports.
  # frontendSecurityGroupIDs: [44444444-4444-4444-4444-444444444444]
  # backendSecurityGroupIDs: [55555555-5555-4555-8555-555555555555]
controller:
  domain: e2e.example.test
  image: registry.example.test/gateway-api-openstack/controller@sha256:<digest>
  sourceRevision: <git-commit>
backend:
  image: registry.k8s.io/e2e-test-images/agnhost@sha256:<digest>
  # Replicas default to 2. Set 1 for a cluster with one eligible worker.
  # replicas: 1
  # The default externalTrafficPolicy is Cluster.
  # To restrict members to labeled Nodes with local backend endpoints:
  # externalTrafficPolicy: Local
  # nodeSelector:
  #   e2e.example.test/backend: "true"
# Local lifecycle requires externalNetworkID: none, Local traffic policy, a Node selector, and both
# Kubernetes identity fields. It creates two Gateway graphs sequentially.
# scenarios:
#   localLifecycle: true
# Member transitions alone require two replicas, a Node selector, and both identity fields.
# Cluster requires exactly two eligible workers and either a dedicated project
# or the shared network test opt-in with pinned worker identities.
# scenarios:
#   memberTransitions: true
# To approve one detachment of this run's own Floating IP, select the scenario below.
# It requires an externalNetworkID, both cluster identity fields, Neutron revision
# extensions, and either a dedicated project or the shared network test opt-in.
# It reuses the initial Gateway graph and cannot be combined with localLifecycle.
# scenarios:
#   floatingIPRecovery: true
# Under the same restrictions, delete and replace only this run's own Floating IP:
#   floatingIPDeletion: true
# Omit artifacts to use _artifacts/e2e/<run-id> below the repository.
# Recurring validation requires an existing directory outside the checkout.
# artifacts:
#   root: /absolute/path/to/e2e-artifacts
